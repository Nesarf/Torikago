[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torikago"
version = "1.20.5"
description = "Static triage for an unknown executable: identify, unpack, extract indicators. Never executes the target."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# The name, plus the category words people actually search for. A codename does not do
# ambient discovery, so the descriptive terms stay in the metadata rather than in the name.
keywords = ["malware", "triage", "torikago", "pe", "static-analysis", "yara", "dfir"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
# Nanodesu! is discovered at runtime, never required at install time. `torikago` declares no
# dependencies on purpose: it is meant to run on a machine you do not control, so every
# dependency it does not have is one less thing a reader has to audit. The PyInstaller half
# is therefore an extra rather than a requirement -- `pip install torikago[pyinstaller]`
# makes it turnkey, and the base install stays empty.
pyinstaller = ["nanodesu>=1.2,<2"]
# The sample vault needs real AES, and the standard library cannot write encrypted zip members --
# it will happily set the encrypted bit and write plaintext. So this is an extra rather than
# something worked around, and its absence is a reported failure rather than a silent downgrade.
vault = ["pyzipper>=0.3.6"]
# Optional, and the absence is reported rather than hidden. `check_yara_syntax` compiles the
# drafted rule to catch a syntax error before `--handoff` gives it to someone else. It never
# matches the rule against anything -- compiling parses text, matching would run a pattern
# engine over the sample, and that is the "Never runs the target" red line.
yara = ["yara-python>=4.3"]
# `--window` needs an image library. Measured on a clean venv install of this wheel: `import
# panel_window` succeeds (PIL is imported inside the drawing call), then `open_window` raises
# ModuleNotFoundError and the tool prints the report instead -- loud, and still no window. Same shape
# as the two above, and the same rule: the base install stays empty and the extra is named.
# tkinter is not listed because it is not a pip package: Windows ships it with the official
# interpreter, and a Linux box installs `python3-tk` from its distribution.
window = ["pillow>=9"]

[project.scripts]
torikago = "torikago:main"

[project.urls]
# The PyPI page had no links at all: nowhere to go for the source, the issue tracker or the
# changelog. For a project whose purpose is to be useful to somebody who just found it, a
# dead-end page is the wrong first impression.
Homepage = "https://github.com/Nesarf/Torikago"
Repository = "https://github.com/Nesarf/Torikago"
Issues = "https://github.com/Nesarf/Torikago/issues"
Changelog = "https://github.com/Nesarf/Torikago/releases"

[tool.setuptools]
# Both modules, not just the one named after the project. `unpack.py` was missing from the
# published 1.3.0 wheel, so `--unpack` could not work at all for anyone who installed it:
# the module the flag delegates to simply was not there. Found by installing from PyPI and
# importing, which is the only check that would have caught it -- the local tree has the
# file, so every local test passed.
py-modules = [
    "torikago",
    "unpack",
    "corpus",
    "corpus_verify",
    "security_posture",
    "product_registration",
    "sample_fetch",
    "sample_vault",
    "provider_malshare",
    "take_samples",
    # `--window` paints a panel from two files Ichiwatashi exports, and the module that does the
    # painting has to be in the wheel for that to be possible after `pip install`. Same defect as
    # `unpack.py` above, one flag further along: the local tree has the file, so every local test
    # passes and the published package cannot open a window at all.
    "panel_window",
]

# The two files the window is painted from. **They are not modules, so `py-modules` cannot carry
# them**, and `package-data` only applies to packages -- this distribution is a flat set of modules.
# Measured on a built wheel: without this table the wheel holds `panel_window.py` and neither JSON,
# so `--window` raises FileNotFoundError for every user who installed rather than cloned.
[tool.setuptools.data-files]
"share/torikago" = ["panel.json", "font.json"]
