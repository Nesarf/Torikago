[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-static"
version = "0.7.0"
description = "Static triage for an unknown executable: identify, unpack, extract indicators. Never executes the target."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["malware", "triage", "pe", "static-analysis", "yara", "dfir"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
triage = "triage:main"

[tool.setuptools]
py-modules = ["triage"]
