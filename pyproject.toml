[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torikago"
version = "1.3.0"
description = "Static triage for an unknown executable: identify, unpack, extract indicators. Never executes the target."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# The name, plus the category words people actually search for. A codename does not do
# ambient discovery, so the descriptive terms stay in the metadata rather than in the name.
keywords = ["malware", "triage", "torikago", "pe", "static-analysis", "yara", "dfir"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
# Nanodesu! is discovered at runtime, never required at install time. `torikago` declares no
# dependencies on purpose: it is meant to run on a machine you do not control, so every
# dependency it does not have is one less thing a reader has to audit. The PyInstaller half
# is therefore an extra rather than a requirement -- `pip install torikago[pyinstaller]`
# makes it turnkey, and the base install stays empty.
pyinstaller = ["nanodesu>=1.2,<2"]

[project.scripts]
torikago = "torikago:main"

[tool.setuptools]
py-modules = ["torikago"]
