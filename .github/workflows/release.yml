# Publish Torikago on a tag.
#
# A pure-Python package, so there is no binary to build and nothing to sign: `pip` verifies the
# wheel against the index hashes, which is a stronger guarantee than an Authenticode signature on
# a file nobody is obliged to check.
#
# PyPI publication uses **Trusted Publishing**, not a token: the runner asks GitHub for an OIDC
# token, PyPI verifies it came from this repository, this workflow file and the environment named
# below, and issues a short-lived upload credential. Nothing secret is stored anywhere.
#
# The environment name is pinned here so that what the PyPI settings page must say is unambiguous.
# A mismatch between this string and the publisher configured on PyPI is the most common way this
# fails, and it fails at the last step of a release, after everything else has gone green.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    env:
      PYPI_NAME: torikago
    environment:
      name: pypi
      url: https://pypi.org/p/torikago
    permissions:
      id-token: write       # required for Trusted Publishing; without it the upload is refused
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the build tooling
        run: python -m pip install --upgrade build twine

      - name: The tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag declared=$declared"
          test "$tag" = "$declared" || { echo "::error::tag $tag does not match version $declared"; exit 1; }

      - name: Install the image library the suite needs to check pixels
        # Without it the rendering tests skip instead of failing, so the gate that decides whether this
        # release is good would quietly stop checking the pixels. The release job needs pillow anyway
        # for the installed-wheel render below.
        run: python -m pip install --quiet --disable-pip-version-check pillow

      - name: The suite must pass before anything is published
        run: python -m unittest discover -s test

      - name: Build
        run: python -m build

      - name: The sdist can run its own suite
        # **The gate that was missing, and the defect it exists for.** 1.20.4 shipped an sdist carrying
        # `test/test_*.py` and not `test/_fixtures.py`, `PERSONA.md` or `tools/pixelart.py`: unpacked and
        # run, 391 tests and 7 errors -- while the same suite was green above, because the checkout **is**
        # the repository. Publishing something that cannot be tested after it is published is the defect,
        # so this runs the artifact rather than the checkout.
        #
        # `mktemp` rather than a fixed path: a directory left by an earlier run would let this pass on
        # files that are no longer the ones in `dist/`.
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$tmp"
          cd "$tmp"/*/
          python -m unittest discover -s test

      - name: Validate the distributions
        run: python -m twine check dist/*

      - name: List what is actually in the wheel, and refuse a missing part
        # A build that succeeds says nothing about its contents. A release of this very package once
        # shipped without `unpack.py` -- the whole implementation behind `--unpack` -- and the build,
        # `twine check` and the install all reported success. Only the file list showed it.
        #
        # The window added three things that can go missing the same way, and the check was written for
        # two files: `panel_window.py`, plus the two JSON files it paints from. Those travel as
        # `data-files`, so they land under `share/torikago` with the version in the path -- matched by
        # suffix rather than by full name, so adding them does not pin the version here.
        run: |
          python - <<'PY'
          import glob, zipfile
          names = set()
          for wheel in sorted(glob.glob("dist/*.whl")):
              print(wheel)
              for name in zipfile.ZipFile(wheel).namelist():
                  print("   ", name)
                  names.add(name)
          missing = sorted({"torikago.py", "unpack.py", "panel_window.py"} - names)
          for wanted in ("share/torikago/panel.json", "share/torikago/font.json"):
              if not any(n.endswith(wanted) for n in names):
                  missing.append(wanted)
          if missing:
              raise SystemExit("the wheel is missing %s" % missing)
          print("every required entry is present")
          PY

      - name: The installed wheel can paint its own panel
        # The check a file list cannot make. `_embedded()` looks beside the module first and then in
        # `<prefix>/share/torikago`; only the second branch exists for somebody who ran `pip install`,
        # and it is the branch nobody exercises by developing from a clone. Installed from a directory
        # that is not the checkout, because a path relative to the working directory passes here and
        # fails for every user.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl Pillow
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import pathlib, sysconfig
          import panel_window as pw
          share = pathlib.Path(sysconfig.get_path("data")) / "share" / "torikago"
          layout = pw.load(str(share / "panel.json"))
          draw = pw.load_font(str(share / "font.json"))
          image = layout.image(["the installed copy paints its own panel"], title="RELEASE", draw_fn=draw)
          assert image.size[0] > 0 and image.size[1] > 0, image.size
          print("painted %s from %s" % (image.size, share))
          PY

      - name: Is this version already on PyPI?
        # PyPI refuses to overwrite a published file, which is correct of it and is what makes a
        # release trustworthy. The consequence for CI is that re-running this workflow for an
        # already-published version used to fail at the last step -- a red X on a finished release,
        # which teaches people to ignore red Xs. So the upload is skipped with an explanation
        # instead, and the job reports success because the end state is the one it wanted.
        id: exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PYPI_NAME}/${version}/json")
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PYPI_NAME} ${version} is already published; skipping the upload"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${PYPI_NAME} ${version} is not published yet (HTTP $code)"
          fi

      - name: Publish to PyPI
        if: steps.exists.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70  # release/v1
        with:
          # Nothing to configure: the action finds the OIDC token in the environment and PyPI
          # matches it against the publisher registered for this repository and workflow.
          packages-dir: dist/

      - name: Report the outcome
        run: |
          if [ "${{ steps.exists.outputs.already }}" = "true" ]; then
            echo "::notice::this run published nothing: the version was already on PyPI"
          else
            echo "published ${PYPI_NAME} ${GITHUB_REF_NAME#v} to PyPI"
          fi

  release-notes:
    name: attach the notes to the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Create the release with the notes committed for this version
        # **Two jobs, one release, and no ordering between them.** This job ran to completion while the
        # publish job failed at the suite, so a GitHub release existed for a version that never reached
        # PyPI. Re-running a release then tripped over the release it had already made, which is the
        # "red X on a finished release" this file elsewhere goes out of its way to avoid. Leaving an
        # existing release alone makes the job repeatable, and the notes are the same file either way.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="RELEASE_NOTES_${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is not in the tree; a release without notes is a release nobody can review later"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Torikago ${version}" \
              --notes-file "$notes" \
              --verify-tag
          fi
