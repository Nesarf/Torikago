name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow only reads the repository and runs the test suite.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13", "3.14"]

    steps:
      # Pinned to commit SHAs, not movable tags: a tag can be retagged upstream and a
      # workflow referencing @v4 would then run whatever it points at.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683     # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m py_compile torikago.py

      - name: Install the image library the rendering tests want
        # `pillow` is the `window` extra, and those tests skip without it rather than fail. Installed
        # where a wheel exists and skipped where one does not, because the matrix must keep testing the
        # analysis on every interpreter even when the extra is unavailable for one of them.
        run: python -m pip install --quiet --disable-pip-version-check pillow || python -c "print('pillow is unavailable for this interpreter; the rendering tests will skip')"

      - name: Run the test suite
        run: python -m unittest discover -s test -v

      - name: CLI smoke test
        run: python torikago.py --help
